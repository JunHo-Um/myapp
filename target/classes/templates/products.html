<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제품 관리</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .sidebar {
            min-height: 100vh;
            box-shadow: inset -1px 0 0 rgba(0, 0, 0, .1);
        }
        .navbar-brand {
            padding-top: .75rem;
            padding-bottom: .75rem;
            background-color: rgba(0, 0, 0, .25);
            box-shadow: inset -1px 0 0 rgba(0, 0, 0, .25);
        }
        .sidebar .nav-link {
            color: #333;
        }
        .sidebar .nav-link:hover {
            color: #007bff;
        }
        .sidebar .nav-link.active {
            color: #007bff;
        }
        .product-image {
            width: 48px;
            height: 48px;
            background: linear-gradient(45deg, #f8f9fa, #e9ecef);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #6c757d;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- 사이드바 -->
            <nav id="sidebar" class="col-md-3 col-lg-2 d-md-block bg-light sidebar collapse">
                <div class="position-sticky pt-3">
                    <div class="navbar-brand px-3 mb-3">
                        <i class="fas fa-tachometer-alt me-2"></i>대시보드
                    </div>
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/}">
                                <i class="fas fa-home me-2"></i>홈
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/users}">
                                <i class="fas fa-users me-2"></i>사용자 관리
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/orders}">
                                <i class="fas fa-shopping-cart me-2"></i>주문 관리
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" th:href="@{/products}">
                                <i class="fas fa-box me-2"></i>제품 관리
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>

            <!-- 메인 컨텐츠 -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2">제품 관리</h1>
                    <div class="btn-toolbar mb-2 mb-md-0">
                        <div class="btn-group me-2">
                            <button type="button" class="btn btn-sm btn-success">
                                <i class="fas fa-plus"></i> 새 제품
                            </button>
                            <button type="button" class="btn btn-sm btn-outline-secondary">
                                <i class="fas fa-download"></i> 엑셀 다운로드
                            </button>
                        </div>
                    </div>
                </div>

                <!-- 검색 및 필터 -->
                <div class="row mb-3">
                    <div class="col-md-3">
                        <select class="form-select">
                            <option value="">모든 카테고리</option>
                            <option value="전자제품">전자제품</option>
                            <option value="가구">가구</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <select class="form-select">
                            <option value="">모든 상태</option>
                            <option value="ACTIVE">활성</option>
                            <option value="DISCONTINUED">단종</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <select class="form-select">
                            <option value="">재고 상태</option>
                            <option value="low">재고 부족 (10개 미만)</option>
                            <option value="normal">정상 재고</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <div class="input-group">
                            <input type="text" class="form-control" placeholder="제품명으로 검색...">
                            <button class="btn btn-outline-secondary" type="button">
                                <i class="fas fa-search"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- 제품 테이블 -->
                <div class="card">
                    <div class="card-header">
                        <h6 class="m-0 font-weight-bold text-primary">
                            전체 제품 목록 
                            <span class="badge bg-primary" th:text="${products.size()}">0</span>
                        </h6>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-bordered table-hover">
                                <thead class="table-light">
                                    <tr>
                                        <th>제품</th>
                                        <th>카테고리</th>
                                        <th>가격</th>
                                        <th>재고</th>
                                        <th>상태</th>
                                        <th>설명</th>
                                        <th>액션</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="product : ${products}">
                                        <td>
                                            <div class="d-flex align-items-center">
                                                <div class="product-image me-3">
                                                    <i class="fas fa-box"></i>
                                                </div>
                                                <div>
                                                    <div class="fw-bold" th:text="${product.name}">노트북</div>
                                                    <small class="text-muted">ID: <span th:text="${product.id}">1</span></small>
                                                </div>
                                            </div>
                                        </td>
                                        <td>
                                            <span class="badge bg-info" th:text="${product.category}">전자제품</span>
                                        </td>
                                        <td>
                                            <strong th:text="${#numbers.formatDecimal(product.price, 0, 0) + '원'}">1,200,000원</strong>
                                        </td>
                                        <td>
                                            <span th:class="${product.stock < 10 ? 'badge bg-danger' : 'badge bg-success'}" 
                                                  th:text="${product.stock + '개'}">15개</span>
                                        </td>
                                        <td>
                                            <span th:class="${product.status == 'ACTIVE' ? 'badge bg-success' : 'badge bg-secondary'}" 
                                                  th:text="${product.status == 'ACTIVE' ? '활성' : '단종'}">활성</span>
                                        </td>
                                        <td>
                                            <div style="max-width: 200px;">
                                                <small th:text="${product.description}">고성능 비즈니스 노트북</small>
                                            </div>
                                        </td>
                                        <td>
                                            <div class="btn-group" role="group">
                                                <button type="button" class="btn btn-sm btn-outline-primary">
                                                    <i class="fas fa-eye"></i>
                                                </button>
                                                <button type="button" class="btn btn-sm btn-outline-warning">
                                                    <i class="fas fa-edit"></i>
                                                </button>
                                                <button type="button" class="btn btn-sm btn-outline-danger">
                                                    <i class="fas fa-trash"></i>
                                                </button>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- 페이지네이션 -->
                <div class="d-flex justify-content-between align-items-center mt-3">
                    <div>
                        <small class="text-muted">총 <strong th:text="${products.size()}">8</strong>개의 제품</small>
                    </div>
                    <nav>
                        <ul class="pagination pagination-sm mb-0">
                            <li class="page-item disabled">
                                <a class="page-link" href="#" tabindex="-1">이전</a>
                            </li>
                            <li class="page-item active">
                                <a class="page-link" href="#">1</a>
                            </li>
                            <li class="page-item">
                                <a class="page-link" href="#">2</a>
                            </li>
                            <li class="page-item">
                                <a class="page-link" href="#">3</a>
                            </li>
                            <li class="page-item">
                                <a class="page-link" href="#">다음</a>
                            </li>
                        </ul>
                    </nav>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
