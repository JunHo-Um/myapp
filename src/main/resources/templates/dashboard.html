<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>대시보드</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .sidebar {
            min-height: 100vh;
            box-shadow: inset -1px 0 0 rgba(0, 0, 0, .1);
        }
        .navbar-brand {
            padding-top: .75rem;
            padding-bottom: .75rem;
            background-color: rgba(0, 0, 0, .25);
            box-shadow: inset -1px 0 0 rgba(0, 0, 0, .25);
        }
        .sidebar .nav-link {
            color: #333;
        }
        .sidebar .nav-link:hover {
            color: #007bff;
        }
        .sidebar .nav-link.active {
            color: #007bff;
        }
        .card-stats {
            background: linear-gradient(45deg, #007bff, #0056b3);
            color: white;
        }
        .card-stats.success {
            background: linear-gradient(45deg, #28a745, #1e7e34);
        }
        .card-stats.warning {
            background: linear-gradient(45deg, #ffc107, #e0a800);
        }
        .card-stats.danger {
            background: linear-gradient(45deg, #dc3545, #c82333);
        }
        .table-responsive {
            max-height: 400px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- 사이드바 -->
            <nav id="sidebar" class="col-md-3 col-lg-2 d-md-block bg-light sidebar collapse">
                <div class="position-sticky pt-3">
                    <div class="navbar-brand px-3 mb-3">
                        <i class="fas fa-tachometer-alt me-2"></i>대시보드
                    </div>
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link active" th:href="@{/}">
                                <i class="fas fa-home me-2"></i>홈
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/users}">
                                <i class="fas fa-users me-2"></i>사용자 관리
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/orders}">
                                <i class="fas fa-shopping-cart me-2"></i>주문 관리
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/products}">
                                <i class="fas fa-box me-2"></i>제품 관리
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>

            <!-- 메인 컨텐츠 -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2">대시보드 개요</h1>
                    <div class="btn-toolbar mb-2 mb-md-0">
                        <div class="btn-group me-2">
                            <button type="button" class="btn btn-sm btn-outline-secondary">오늘</button>
                            <button type="button" class="btn btn-sm btn-outline-secondary">이번 주</button>
                            <button type="button" class="btn btn-sm btn-outline-secondary">이번 달</button>
                        </div>
                    </div>
                </div>

                <!-- 통계 카드들 -->
                <div class="row mb-4">
                    <div class="col-xl-3 col-md-6 mb-4">
                        <div class="card card-stats h-100">
                            <div class="card-body">
                                <div class="row no-gutters align-items-center">
                                    <div class="col mr-2">
                                        <div class="text-xs font-weight-bold text-uppercase mb-1">총 사용자</div>
                                        <div class="h5 mb-0 font-weight-bold" th:text="${totalUsers}">0</div>
                                    </div>
                                    <div class="col-auto">
                                        <i class="fas fa-users fa-2x text-gray-300"></i>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="col-xl-3 col-md-6 mb-4">
                        <div class="card card-stats success h-100">
                            <div class="card-body">
                                <div class="row no-gutters align-items-center">
                                    <div class="col mr-2">
                                        <div class="text-xs font-weight-bold text-uppercase mb-1">총 주문</div>
                                        <div class="h5 mb-0 font-weight-bold" th:text="${totalOrders}">0</div>
                                    </div>
                                    <div class="col-auto">
                                        <i class="fas fa-shopping-cart fa-2x text-gray-300"></i>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="col-xl-3 col-md-6 mb-4">
                        <div class="card card-stats warning h-100">
                            <div class="card-body">
                                <div class="row no-gutters align-items-center">
                                    <div class="col mr-2">
                                        <div class="text-xs font-weight-bold text-uppercase mb-1">총 제품</div>
                                        <div class="h5 mb-0 font-weight-bold" th:text="${totalProducts}">0</div>
                                    </div>
                                    <div class="col-auto">
                                        <i class="fas fa-box fa-2x text-gray-300"></i>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="col-xl-3 col-md-6 mb-4">
                        <div class="card card-stats danger h-100">
                            <div class="card-body">
                                <div class="row no-gutters align-items-center">
                                    <div class="col mr-2">
                                        <div class="text-xs font-weight-bold text-uppercase mb-1">총 매출</div>
                                        <div class="h5 mb-0 font-weight-bold" th:text="${#numbers.formatDecimal(totalRevenue, 0, 0) + '원'}">0원</div>
                                    </div>
                                    <div class="col-auto">
                                        <i class="fas fa-won-sign fa-2x text-gray-300"></i>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 테이블들 -->
                <div class="row">
                    <!-- 최근 사용자들 -->
                    <div class="col-lg-6 mb-4">
                        <div class="card">
                            <div class="card-header d-flex justify-content-between align-items-center">
                                <h6 class="m-0 font-weight-bold text-primary">최근 등록된 사용자</h6>
                                <a th:href="@{/users}" class="btn btn-sm btn-primary">전체 보기</a>
                            </div>
                            <div class="card-body">
                                <div class="table-responsive">
                                    <table class="table table-bordered table-hover">
                                        <thead class="table-light">
                                            <tr>
                                                <th>이름</th>
                                                <th>부서</th>
                                                <th>상태</th>
                                                <th>등록일</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr th:each="user : ${recentUsers}">
                                                <td th:text="${user.name}">김철수</td>
                                                <td th:text="${user.department}">개발팀</td>
                                                <td>
                                                    <span th:class="${user.status == 'ACTIVE' ? 'badge bg-success' : 'badge bg-secondary'}" 
                                                          th:text="${user.status == 'ACTIVE' ? '활성' : '비활성'}">활성</span>
                                                </td>
                                                <td th:text="${#temporals.format(user.createdAt, 'yyyy-MM-dd')}">2023-12-01</td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 최근 주문들 -->
                    <div class="col-lg-6 mb-4">
                        <div class="card">
                            <div class="card-header d-flex justify-content-between align-items-center">
                                <h6 class="m-0 font-weight-bold text-primary">최근 주문</h6>
                                <a th:href="@{/orders}" class="btn btn-sm btn-primary">전체 보기</a>
                            </div>
                            <div class="card-body">
                                <div class="table-responsive">
                                    <table class="table table-bordered table-hover">
                                        <thead class="table-light">
                                            <tr>
                                                <th>주문번호</th>
                                                <th>고객명</th>
                                                <th>금액</th>
                                                <th>상태</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr th:each="order : ${recentOrders}">
                                                <td th:text="${order.orderNumber}">ORD-001</td>
                                                <td th:text="${order.customerName}">김철수</td>
                                                <td th:text="${#numbers.formatDecimal(order.amount, 0, 0) + '원'}">1,200,000원</td>
                                                <td>
                                                    <span th:class="${order.status == 'COMPLETED' ? 'badge bg-success' : 
                                                                     order.status == 'PENDING' ? 'badge bg-warning' : 
                                                                     order.status == 'SHIPPED' ? 'badge bg-info' : 'badge bg-danger'}" 
                                                          th:text="${order.status == 'COMPLETED' ? '완료' : 
                                                                   order.status == 'PENDING' ? '대기' : 
                                                                   order.status == 'SHIPPED' ? '배송중' : '취소'}">완료</span>
                                                </td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 재고 부족 제품들 -->
                <div class="row">
                    <div class="col-12">
                        <div class="card mb-4">
                            <div class="card-header d-flex justify-content-between align-items-center">
                                <h6 class="m-0 font-weight-bold text-danger">재고 부족 제품 (10개 미만)</h6>
                                <a th:href="@{/products}" class="btn btn-sm btn-primary">전체 보기</a>
                            </div>
                            <div class="card-body">
                                <div class="table-responsive">
                                    <table class="table table-bordered table-hover">
                                        <thead class="table-light">
                                            <tr>
                                                <th>제품명</th>
                                                <th>카테고리</th>
                                                <th>재고</th>
                                                <th>가격</th>
                                                <th>상태</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr th:each="product : ${lowStockProducts}">
                                                <td th:text="${product.name}">마우스</td>
                                                <td th:text="${product.category}">전자제품</td>
                                                <td>
                                                    <span class="badge bg-danger" th:text="${product.stock + '개'}">5개</span>
                                                </td>
                                                <td th:text="${#numbers.formatDecimal(product.price, 0, 0) + '원'}">50,000원</td>
                                                <td>
                                                    <span th:class="${product.status == 'ACTIVE' ? 'badge bg-success' : 'badge bg-secondary'}" 
                                                          th:text="${product.status == 'ACTIVE' ? '활성' : '비활성'}">활성</span>
                                                </td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
